# Builds the addon zip on GitHub and puts it on a Release, for guildies to download.
#
#   Release:    commit and push your changes, then
#                 git tag v0.4.0
#                 git push origin v0.4.0
#               → a Release "Kor'kron Companion v0.4.0" appears with KorKronCompanion-0.4.0.zip attached. The tag
#                 sets the version: it's written into the .toc's "## Version:" line inside the zip.
#   Test build: Actions tab → "Release" → Run workflow. The zip (with the .toc's own version) is attached to the run,
#               no Release.
#
# The zip holds one folder, KorKronCompanion, to unpack into World of Warcraft\_forever_\Interface\AddOns.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip
        run: |
          toc=addon/KorKronCompanion/KorKronCompanion.toc
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            sed -i "s/^## Version:.*/## Version: ${version}/" "$toc"
          else
            version="$(sed -n 's/^## Version: *//p' "$toc" | tr -d '\r')-test"
          fi
          echo "Version $version"
          mkdir -p dist
          (cd addon && zip -r -q "../dist/KorKronCompanion-${version}.zip" KorKronCompanion)
          unzip -l dist/*.zip

      - name: Keep the zip with the run
        uses: actions/upload-artifact@v4
        with:
          name: KorKronCompanion
          path: dist/*.zip

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Kor'kron Companion ${{ github.ref_name }}
          files: dist/*.zip
          generate_release_notes: true
